[project]
name = "alpha-progression-mcp"
version = "0.1.0"
description = "MCP server for Alpha Progression: let Claude and other AI assistants read your gym workouts, sets, plans and bodyweight"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "mcp-server", "alpha-progression", "gym", "strength-training", "workout", "fitness", "claude", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/dorian-k/alpha-progression-mcp"
Issues = "https://github.com/dorian-k/alpha-progression-mcp/issues"

[project.scripts]
alpha-progression-mcp = "alpha_progression_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
